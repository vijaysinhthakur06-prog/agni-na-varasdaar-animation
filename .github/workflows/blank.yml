🔥 અગ્નિનો વારસદાર

Episode 1 — “છુપાયેલી શક્તિ”

---

🎬 SCENE 1 — ગામ | સાંજ

CAMERA SHOT:

- Wide Establishing Shot: આખું ગામ, પહાડો અને અસ્ત થતો સૂર્ય બતાવો.
- Slow Pan: કેમેરા ગામની ગલીઓમાંથી ધીમે ધીમે આગળ વધે.
- Medium Shot: બાળકો રમતા અને ગામવાસીઓ પોતાના કામમાં વ્યસ્ત દેખાય.

CAMERA MOVEMENT:
ધીમે-ધીમે કેમેરા આરવ તરફ Push-in કરે.

ACTION:
(કેમેરા આરવના હાથ પર Close-up કરે છે. તેના હાથ પર રહસ્યમય અગ્નિનું ચિહ્ન દેખાય છે.)

આરવ:
“આ નિશાન મને જન્મથી જ કેમ મળ્યું છે?”

CAMERA:
ચિહ્નનો Extreme Close-up → Fade to Black.

---

🎬 SCENE 2 — આરવનું ઘર | રાત

CAMERA SHOT:

- Interior Wide Shot: નાનું ઘર, દીવો અને આરવ-દાદી એકસાથે બેઠેલા.
- Over-the-Shoulder Shot: દાદીના ખભા પાછળથી આરવ દેખાય.
- Close-up: આરવના ચિંતિત ચહેરા પર.

આરવ:
“દાદી, આ ચિહ્ન વિશે તમે મને ક્યારેય કેમ નથી કહેતા?”

દાદી:
“કારણ કે… કેટલીક સચ્ચાઈઓ જાણવી એ પોતે જ જોખમ છે.”

CAMERA:
દાદીના ચહેરા પર ધીમો Push-in.

દાદી:
“તારા પિતાએ પણ આ જ ચિહ્ન પહેર્યું હતું…”

CAMERA:
આરવના ચહેરાનો Close-up → તેની આંખોમાં આશ્ચર્ય.

---

🎬 SCENE 3 — આકાશમાં ફેરફાર

CAMERA SHOT:

- Low-Angle Shot: આરવ આકાશ તરફ જુએ છે.
- Tilt Up: કેમેરા આરવ પરથી આકાશ તરફ જાય.
- Extreme Wide Shot: આખું આકાશ લાલ દેખાય.

SFX:
જોરદાર પવન + દૂરથી ગર્જના.

ગામનો માણસ:
“આકાશને શું થયું?!”

CAMERA:
કેમેરા ઝડપથી ગામની બહાર તરફ Whip Pan કરે.

(દૂર કાળો ધુમાડો ગામ તરફ આગળ વધે છે.)

---

🎬 SCENE 4 — ગામ પર હુમલો

CAMERA SHOT:

- Wide Shot: કાળા પડછાયાઓ ગામમાં પ્રવેશ કરે.
- Handheld-style Tracking Shot: આરવ દોડતો દેખાય.
- Close-up: આરવના ડરાયેલા ચહેરા પર.

ગામવાળો:
“બધા લોકો ઘરમાં જાઓ!”

આરવ:
“મારી દાદી ક્યાં છે?!”

CAMERA MOVEMENT:
કેમેરા આરવની પાછળથી Tracking Shot કરે.

(આરવ દોડીને ઘરે પહોંચે છે.)

દાદી:
“આરવ! અહીંથી તરત જા!”

આરવ:
“ના! હું તમને છોડીને નહીં જાઉં!”

CAMERA:
બંનેનો Two-Shot → પછી દાદીના ચિંતિત ચહેરાનો Close-up.

---

🎬 SCENE 5 — શક્તિનો જાગરણ

CAMERA SHOT:

- Low-Angle Shot: રહસ્યમય શત્રુ આરવની સામે ઊભો છે.
- Over-the-Shoulder: શત્રુની પાછળથી આરવ દેખાય.
- Extreme Close-up: આરવના હાથ પરનું ચિહ્ન.

શત્રુ:
“અંતે… અગ્નિનો વારસદાર મળી ગયો.”

આરવ:
“તું મને ઓળખે છે?”

શત્રુ:
“તારા પિતાને પણ અમે ઓળખતા હતા.”

CAMERA:
આરવના ચહેરા પર Slow Push-in.

આરવ:
“મારા પિતા વિશે તું શું જાણે છે?!”

(અચાનક ચિહ્ન તેજસ્વી થાય છે.)

CAMERA MOVEMENT:

- 360° Orbit Shot: કેમેરા આરવની આસપાસ ફરે.
- જમીન પર અગ્નિની લહેર ફેલાય.

આરવ:
“હું… કોઈને મારા પરિવારને નુકસાન નહીં કરવા દઉં!”

CAMERA:
Low-Angle Hero Shot — આરવની પાછળ અગ્નિનો પ્રકાશ.

---

🎬 SCENE 6 — રહસ્યમય યોદ્ધાની એન્ટ્રી

CAMERA SHOT:

- Extreme Wide Shot: આકાશમાંથી એક આકૃતિ નીચે આવે.
- Low-Angle Shot: યોદ્ધા જમીન પર ઉતરે.
- ઉતરતી વખતે Slow Motion.

SFX:
ધડામ!

યોદ્ધા:
“આ શક્તિ તું અહીં કાબૂમાં નહીં રાખી શકે.”

CAMERA:
Shot-Reverse-Shot: યોદ્ધા → આરવ → યોદ્ધા.

આરવ:
“તમે કોણ છો?”

યોદ્ધા:
“જે માણસ તારા પિતાને છેલ્લી વાર જીવતા જોયો હતો.”

CAMERA:
આરવની આંખોનો Extreme Close-up.

આરવ:
“મારા પિતા… જીવતા હતા?”

યોદ્ધા:
“આ સવાલનો જવાબ મેળવવો હોય… તો મારી સાથે આવ.”

---

🎬 SCENE 7 — અંતિમ શોટ

CAMERA SHOT:

- Wide Back Shot: આરવ ગામ સામે ઊભો છે.
- કેમેરા ધીમે ધીમે પાછળ જાય.
- આરવ આગળ અજાણ્યો રસ્તો જુએ છે.

આરવ:
“હું પાછો આવીશ… અને દરેક સવાલનો જવાબ લઈને આવીશ.”

CAMERA MOVEMENT:
Crane Up / Aerial Shot: કેમેરા આરવથી ઉપર ઊઠે.

(દૂર પહાડોની પાછળ એક વિશાળ કાળો કિલ્લો દેખાય છે.)

CAMERA:
કિલ્લા તરફ Slow Zoom-in.

શત્રુનો અવાજ:
“અગ્નિ પાછો જાગી ગયો છે…”

CAMERA:
કાળા કિલ્લા પર Fade to Black.

